mappings:
  # Patient fields
  - column: "IIS Patient ID"
    resource: Patient
    path: identifier
    type: string
    system: "urn:oid:2.16.840.1.114222.4.1"

  - column: "Name - First"
    resource: Patient
    path: name.given
    type: string

  - column: "Name - Middle"
    resource: Patient
    path: name.given
    type: string

  - column: "Name - Last"
    resource: Patient
    path: name.family
    type: string

  - column: "Date of Birth"
    resource: Patient
    path: birthDate
    type: date

  - column: Gender
    resource: Patient
    path: gender
    type: code
    concept_map:
      - from: M
        to: male
      - from: F
        to: female

  - column: "Address: Street"
    resource: Patient
    path: address(1).line
    type: string

  - column: "Address: City"
    resource: Patient
    path: address(1).city
    type: string

  - column: "Address: State"
    resource: Patient
    path: address(1).state
    type: string

  - column: "Address: Zip"
    resource: Patient
    path: address(1).postalCode
    type: string

  - column: "Telephone Number"
    resource: Patient
    path: telecom
    value: "ContactPoint{system: 'phone', value: $value}"

  - column: "Record Creation Date"
    resource: Patient
    path: meta.lastUpdated
    type: dateTime
    is_last_updated: true

  # Immunization fields
  - column: "IIS Vaccination Event ID"
    resource: Immunization
    path: identifier
    type: string
    system: "urn:oid:2.16.840.1.114222.4.1"

  - column: "Vaccine Type (CVX)"
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'http://hl7.org/fhir/sid/cvx', code: $value}"

  - column: "Vaccine Type (NDC)"
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'http://hl7.org/fhir/sid/ndc', code: $value}"

  - column: "Administration Date"
    resource: Immunization
    path: occurrenceDateTime
    type: dateTime

  - column: Manufacturer
    resource: Immunization
    path: manufacturer
    value: "Reference{display: $value}"

  - column: "Lot Number"
    resource: Immunization
    path: lotNumber
    type: string

  - column: "Route of Administration"
    resource: Immunization
    path: route
    value: "CodeableConcept{coding: Coding{code: $value}}"

  - column: "Site of Administration"
    resource: Immunization
    path: site
    value: "CodeableConcept{coding: Coding{code: $value}}"

  - column: "Expiration Date"
    resource: Immunization
    path: expirationDate
    type: date

  - column: "Dose Volume"
    resource: Immunization
    path: doseQuantity
    value: "Quantity{value: $value}"

  - column: "Record Creation Date"
    resource: Immunization
    path: meta.lastUpdated
    type: dateTime
    is_last_updated: true
