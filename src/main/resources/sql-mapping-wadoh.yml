# WA DOH all_vax_event column mapping
# Source: Washington Automated Immunization Information System (WAIIS) denormalized view
#
# Reference files (docs/sql-fhir/):
#   wa-doh-all-vax-event-dictionary.csv   -- live schema as of 2026-05-27 (56 columns)
#   wa-doh-all-vax-event-notebook.txt     -- Databricks notebook that builds the view
#   wa-doh-all-vax-event-mapping.csv      -- enriched FHIR element assignments
#
# DATABRICKS OUTPUT NOTES:
#   The all_vax_event view (see docs/sql-fhir/wa-doh-all-vax-event-notebook.txt)
#   applies the following transforms before writing to the table:
#   - CAST AS DOUBLE: ASIIS_PAT_ID, BEST_CDC_CODE, Asiis_Vacc_Code, IRMS_SYS_ID,
#       ASIIS_FAC_ID, VFC_ELIGIBLE -- arrive as float strings ("208.0", "1.0").
#       SqlTableMapper.stripDoubleZero() normalizes these before mapping.
#   - ANATOMICAL_SITE: mapped by Databricks to HL7 v2-0163 abbreviated codes
#       (LT, LA, RT, RA, LG, RG, LD, RD, LVL, RVL, LLFA, RLFA).
#   - ANATOMICAL_ROUTE: mapped by Databricks to NCI Thesaurus C-codes
#       (C28161=IM, C38238=ID, C38284=IN, C38276=IV, C38288=Oral, etc.).
#   - DOSE_NUMBER: Databricks CASE -- 'INV' (invalid), 'UNK', or dose number string.
#   - SERIES_COMPLETE: Databricks CASE -- 'YES', 'NO', or 'UNK'.
#   - PROVIDER_FACILITY_TYPE: mapped by Databricks to HL7 v2-0442 numeric codes.
#   - PAT_RACE1-6: raw WAIIS integer codes (1-9) pivoted. OMB mapping is
#       applied here via concept_maps (sourced from the commented-out
#       RecipientRace1-6 block in the notebook, lines 563-628).
#   - HISTORICAL, PAT_GENDER, MANU_CODE, REPORTING_METHOD: passed through unchanged.
#   - Asiis_Vacc_Code column name uses mixed case in the live dictionary.
#
# SYSTEM URIs:
#   Identifier and code system URIs use https://doh.wa.gov/NamingSystem/<ColumnName>
#   as placeholders. WA DOH should confirm or replace these with their canonical
#   NamingSystem URLs if they publish them.
#
# REVIEW CHECKLIST (task 2.3b):
#   [x] DOUBLE column stripping -- implemented in SqlTableMapper.stripDoubleZero()
#   [ ] Confirm https://doh.wa.gov/NamingSystem/* URIs with WA DOH
#   [ ] Confirm HISTORICAL values (assumed "N"=administered, "Y"=historical in VACCINATION_MASTER)
#   [ ] Confirm INSERT_STAMP format in CSV exports (Databricks timestamp:
#         "2020-03-15T14:30:00.000" or "2020-03-15 14:30:00")
#   [ ] Confirm whether ANATOMICAL_SITE, ANATOMICAL_ROUTE, CC_VOLUME,
#         IWEB_VACC_EVENT_ID are present in WA DOH exports
#         (in the notebook SELECT but absent from the 2026-05-27 live dictionary)
#   [x] PAT_RACE1-6 concept maps -- taken from commented-out RecipientRace1-6
#         CASE expressions in the Databricks notebook (lines 563-628)
#   [ ] Confirm PAT_GENDER values in PATIENT_MASTER (assumed M/F/U)

mappings:

  # -----------------------------------------------------------------------
  # PATIENT IDENTITY
  # NOTE: ASIIS_PAT_ID is CAST AS DOUBLE -- CSV value will be "12345678.0"
  # -----------------------------------------------------------------------

  - column: ASIIS_PAT_ID
    resource: Patient
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/ASIIS_PAT_ID"

  # -----------------------------------------------------------------------
  # PATIENT DEMOGRAPHICS  (used for patient search matching)
  # -----------------------------------------------------------------------

  - column: PAT_LAST_NAME
    resource: Patient
    path: name.family
    type: string

  - column: PAT_FIRST_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_MIDDLE_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_BIRTH_DATE
    resource: Patient
    path: birthDate
    type: date

  - column: PAT_GENDER
    resource: Patient
    path: gender
    type: code
    concept_map:
      - from: M
        to: male
      - from: F
        to: female
      - from: U
        to: unknown

  # -----------------------------------------------------------------------
  # PATIENT LANGUAGE
  # -----------------------------------------------------------------------

  - column: PAT_LANGUAGE
    resource: Patient
    path: communication.language
    type: string

  # -----------------------------------------------------------------------
  # PATIENT CONTACT
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_PHONE
    resource: Patient
    path: telecom.phone
    type: string

  - column: PAT_ADDRESS_EMAIL
    resource: Patient
    path: telecom.email
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (current)
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_STREET1
    resource: Patient
    path: address.line
    type: string

  - column: PAT_ADDRESS_STREET2
    resource: Patient
    path: address.line
    type: string

  - column: PAT_ADDRESS_CITY
    resource: Patient
    path: address.city
    type: string

  - column: PAT_ADDRESS_STATE
    resource: Patient
    path: address.state
    type: string

  - column: PAT_ADDRESS_ZIP
    resource: Patient
    path: address.postalCode
    type: string

  - column: PAT_COUNTY_CODE
    resource: Patient
    path: address.district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (at time of vaccination)
  # Databricks builds this via the ADDRESS_ATO_VAX subquery (closest address
  # record to the vaccination date). Mapped with path prefix address.historical.*
  # so SqlPatientRowMapper.accumulateAtoAddresses() processes them separately
  # from the current address. Addresses are accumulated in reverse VACC_DATE
  # order (newest vaccination first) and added as Patient.address with use=old.
  # Consecutive duplicate addresses are collapsed.
  #
  # NOTE: The ADDRESS_ATO_VAX subquery in the Databricks notebook contains a
  # JOIN mismatch: contraindication and deferral UNION branches build their
  # EVENT_ADDRESS_ASSOCIATOR using INSERT_STAMP or DEFERRAL_DATE, but the main
  # query joins on CONCAT(ASIIS_VACC_CODE, VACC_DATE). Only the vaccination
  # branch ever matches. Ask WA DOH whether this is intentional.
  # -----------------------------------------------------------------------

  - column: ATO_PAT_ADDRESS_STREET1
    resource: Patient
    path: address.historical.line
    type: string

  - column: ATO_PAT_ADDRESS_STREET2
    resource: Patient
    path: address.historical.line
    type: string

  - column: ATO_PAT_ADDRESS_CITY
    resource: Patient
    path: address.historical.city
    type: string

  - column: ATO_PAT_ADDRESS_STATE
    resource: Patient
    path: address.historical.state
    type: string

  - column: ATO_PAT_ADDRESS_ZIP
    resource: Patient
    path: address.historical.postalCode
    type: string

  - column: ATO_PAT_COUNTY_CODE
    resource: Patient
    path: address.historical.district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ETHNICITY -- DEFERRED, needs WA DOH confirmation
  # Databricks passes pat_ethnicity_code through unchanged (CAST AS string).
  # We do not know whether the WAIIS values are OMB codes or internal integers.
  # Confirm with WA DOH before enabling.
  # -----------------------------------------------------------------------
  # PAT_ETHNICITY_CODE -- deferred

  # -----------------------------------------------------------------------
  # PATIENT RACE  (PAT_RACE1-6)
  # Databricks pivots PATIENT_RACE_RESERVE.pat_race (try_cast to int) into six
  # slots ordered by race code integer ascending. The OMB mappings below are
  # taken directly from the commented-out RecipientRace1-6 CASE expressions in
  # the Databricks notebook (lines 563-628). Code 3 has no WHEN clause and is
  # left unmapped. Code 9 and ELSE (RecipientRace1) map to 'UNK' and are
  # silently skipped (no ombCategory sub-extension for unknown race).
  # Both slots 6 and 8 map to '2131-1' (Other Race).
  # All six columns use the same concept_map; they accumulate into a single
  # US Core race extension (http://hl7.org/fhir/us/core/StructureDefinition/
  # us-core-race) as ombCategory sub-extensions.
  # System: urn:oid:2.16.840.1.113883.6.238 (CDCREC)
  # -----------------------------------------------------------------------

  - column: PAT_RACE1
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE2
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE3
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE4
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE5
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE6
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  # -----------------------------------------------------------------------
  # IMMUNIZATION IDENTITY
  # -----------------------------------------------------------------------

  - column: VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/VACC_EVENT_ID"

  # IWEB_VACC_EVENT_ID: present in the Databricks notebook SELECT but absent
  # from the 2026-05-27 live dictionary -- may have been removed from the table.
  - column: IWEB_VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/IWEB_VACC_EVENT_ID"

  # -----------------------------------------------------------------------
  # VACCINE PRODUCT
  # NOTE: BEST_CDC_CODE is CAST AS DOUBLE -- CSV value will be "208.0" not "208".
  # NOTE: Asiis_Vacc_Code uses mixed case in the live dictionary.
  # -----------------------------------------------------------------------

  - column: BEST_CDC_CODE
    resource: Immunization
    path: vaccineCode.cvx
    type: code
    system: "http://hl7.org/fhir/sid/cvx"

  # Column name is "Asiis_Vacc_Code" (mixed case) per 2026-05-27 dictionary.
  # CAST AS DOUBLE -- will be a float string in CSV exports.
  - column: Asiis_Vacc_Code
    resource: Immunization
    path: vaccineCode
    type: code
    system: "https://doh.wa.gov/NamingSystem/Asiis_Vacc_Code"

  # FAMILY_CODE: ImmuCast (STC) internal vaccine family grouping code.
  # Codes are integers (1-24, with gaps) mapped to ACIP vaccine families:
  #   1=DTaP/DT/Td/Tdap, 2=HIB, 3=POLIO, 4=HepB(3-dose), 5=MMR,
  #   6=VARICELLA, 7=MENINGOCOCCAL, 9=HepA, 10=FLU, 11=PneumoPCV,
  #   12=HepB, 13=ANTHRAX, 14=SMALLPOX, 15=MEASLES, 16=MUMPS,
  #   17=RUBELLA, 18=PneumoPPV, 20=ROTAVIRUS, 21=HPV, 22=ZOSTER,
  #   23=H1N1(inactive), 24=Tdap(inactive, included in code 1)
  # Source: STC ImmuCast documentation (vaccine-group-level grouping only --
  # NOT a CVX, CPT, or MVX code; those use official national publications).
  # System OID must be confirmed with WA DOH -- ImmuCast does not publish a
  # registered OID; WA DOH may assign a local WAIIS OID for this code system.
  - column: FAMILY_CODE
    resource: Immunization
    path: vaccineCode
    type: code
    # Vaccine Family Codes table in ImmuCast 5.18.1 docs (see "Vaccine Family Codes" section)
    system: "https://documentation.stchome.com/assets/prodfiles/ImmuCast/5_18_1/html/vacc_codes.htm"

  - column: NDC_CODE
    resource: Immunization
    path: vaccineCode.ndc
    type: code
    system: "http://hl7.org/fhir/sid/ndc"

  - column: MANU_CODE
    resource: Immunization
    path: manufacturer
    type: code
    system: "http://terminology.hl7.org/CodeSystem/mvx"

  - column: LOT_NUM
    resource: Immunization
    path: lotNumber
    type: string

  - column: EXPIRATION_DATE
    resource: Immunization
    path: expirationDate
    type: date

  # -----------------------------------------------------------------------
  # ADMINISTRATION
  # ANATOMICAL_SITE and ANATOMICAL_ROUTE are present in the notebook SELECT
  # but absent from the 2026-05-27 live dictionary. Included here in case
  # WA DOH exports include them; ignored if the column is not present.
  # View transforms: ANATOMICAL_SITE -> HL7 v2 body site codes (LT, LA, etc.)
  #                  ANATOMICAL_ROUTE -> NCI C-codes (C28161 etc.)
  # -----------------------------------------------------------------------

  - column: VACC_DATE
    resource: Immunization
    path: occurrenceDateTime
    type: date

  - column: ANATOMICAL_SITE
    resource: Immunization
    path: site
    type: code
    system: "http://terminology.hl7.org/CodeSystem/v2-0163"

  - column: ANATOMICAL_ROUTE
    resource: Immunization
    path: route
    type: code
    system: "http://ncimeta.nci.nih.gov"

  # CC_VOLUME: present in the notebook SELECT but absent from the 2026-05-27 dictionary.
  - column: CC_VOLUME
    resource: Immunization
    path: doseQuantity
    type: decimal

  # DOSE_NUMBER: view CASE outputs actual dose number string, 'INV' (invalid),
  # or 'UNK' (unknown).  Passed through as-is.
  - column: DOSE_NUMBER
    resource: Immunization
    path: protocolApplied.doseNumber
    type: string

  # SERIES_COMPLETE: view CASE outputs 'YES', 'NO', or 'UNK'.
  # No FHIR R4 Immunization element accepts a yes/no completion flag directly.
  # Dropped; revisit if WA DOH requires this data point.

  # -----------------------------------------------------------------------
  # RECORD ORIGIN
  # -----------------------------------------------------------------------

  # HISTORICAL: passed through as-is from VACCINATION_MASTER (no view transform).
  # Assumed values: N = administered at facility (primarySource=true),
  #                 Y = historical record (primarySource=false). Verify with WA DOH.
  - column: HISTORICAL
    resource: Immunization
    path: primarySource
    type: boolean
    concept_map:
      - from: "N"
        to: "true"
      - from: "Y"
        to: "false"

  - column: REPORTING_METHOD
    resource: Immunization
    path: reportOrigin
    type: string

  # VFC_ELIGIBLE: CAST AS DOUBLE in the view -- CSV value is "1.0" or "0.0".
  # stripDoubleZero normalizes to "1" or "0" before concept_map lookup.
  # Mapped to fundingSource using HL7 immunization-funding-source codes.
  # "1" = VFC-eligible (publicly funded program); "0" = not VFC-eligible (private).
  - column: VFC_ELIGIBLE
    resource: Immunization
    path: fundingSource
    type: string
    concept_map:
      - from: "1"
        to: "public"
      - from: "0"
        to: "private"

  # -----------------------------------------------------------------------
  # AUDIT / TEMPORAL
  # INSERT_STAMP is the primary _lastUpdated field for temporal filtering.
  # Databricks timestamp format in CSV: "2020-03-15T14:30:00.000" or
  # "2020-03-15 14:30:00" -- confirm with WA DOH export settings.
  # -----------------------------------------------------------------------

  - column: INSERT_STAMP
    resource: Immunization
    path: recorded
    type: dateTime
    is_last_updated: true

  # REGISTRY_ENTRY_STAMP: removed -- INSERT_STAMP is the canonical recorded date.
  # DELETION_DATE: removed -- WHERE clause guarantees it is always NULL.

  # -----------------------------------------------------------------------
  # ADMINISTERING ORGANIZATION / FACILITY
  # Note: Location and Organization resources require additional mapper
  # support. Included for documentation completeness; deferred to future work.
  # PROVIDER_FACILITY_TYPE: view CASE outputs HL7 v2 table 0442 numeric codes
  # (e.g., '9'=Hospital, '12'=Private Practice, '19'=Public Health Dept).
  # -----------------------------------------------------------------------

  - column: ORG_NAME
    resource: Organization
    path: name
    type: string

  - column: VFC_PIN
    resource: Organization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/VFC_PIN"

  - column: IRMS_SYS_ID
    resource: Organization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/IRMS_SYS_ID"

  - column: ASIIS_FAC_ID
    resource: Location
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/ASIIS_FAC_ID"

  - column: FAC_NAME
    resource: Location
    path: name
    type: string

  - column: PROVIDER_FACILITY_TYPE
    resource: Location
    path: type
    type: code
    system: "http://terminology.hl7.org/CodeSystem/v2-0442"

  - column: FAC_ADDRESS_STREET1
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_STREET2
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_CITY
    resource: Location
    path: address.city
    type: string

  - column: FAC_ADDRESS_STATE
    resource: Location
    path: address.state
    type: string

  - column: FAC_ADDRESS_ZIP
    resource: Location
    path: address.postalCode
    type: string

  - column: FAC_ADDRESS_COUNTY_CODE
    resource: Location
    path: address.district
    type: string
