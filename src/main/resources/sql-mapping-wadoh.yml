# WA DOH all_vax_event column mapping
# Source: Washington Automated Immunization Information System (WAIIS) denormalized view
#
# Reference files (docs/sql-fhir/):
#   wa-doh-all-vax-event-dictionary.csv   -- live schema as of 2026-05-27 (56 columns)
#   wa-doh-all-vax-event-notebook.txt     -- Databricks notebook that builds the view
#   wa-doh-all-vax-event-mapping.csv      -- enriched FHIR element assignments
#
# DATABRICKS OUTPUT NOTES:
#   The all_vax_event view (see docs/sql-fhir/wa-doh-all-vax-event-notebook.txt)
#   applies the following transforms before writing to the table:
#   - CAST AS DOUBLE: ASIIS_PAT_ID, BEST_CDC_CODE, Asiis_Vacc_Code, IRMS_SYS_ID,
#       ASIIS_FAC_ID, VFC_ELIGIBLE -- arrive as float strings ("208.0", "1.0").
#       SqlTableMapper.stripDoubleZero() normalizes these before mapping.
#   - ANATOMICAL_SITE: mapped by Databricks to HL7 v2-0163 abbreviated codes
#       (LT, LA, RT, RA, LG, RG, LD, RD, LVL, RVL, LLFA, RLFA).
#   - ANATOMICAL_ROUTE: mapped by Databricks to NCI Thesaurus C-codes
#       (C28161=IM, C38238=ID, C38284=IN, C38276=IV, C38288=Oral, etc.).
#   - DOSE_NUMBER: Databricks CASE -- 'INV' (invalid), 'UNK', or dose number string.
#   - SERIES_COMPLETE: Databricks CASE -- 'YES', 'NO', or 'UNK'.
#   - PROVIDER_FACILITY_TYPE: mapped by Databricks to HL7 v2-0442 numeric codes.
#   - PAT_RACE1-6: raw WAIIS integer codes (1-9) pivoted. OMB mapping is
#       applied here via concept_maps (sourced from the commented-out
#       RecipientRace1-6 block in the notebook, lines 563-628).
#   - HISTORICAL, PAT_GENDER, MANU_CODE, REPORTING_METHOD: passed through unchanged.
#   - Asiis_Vacc_Code column name uses mixed case in the live dictionary.
#
# SYSTEM URIs:
#   Identifier and code system URIs use https://doh.wa.gov/NamingSystem/<ColumnName>
#   as placeholders. WA DOH should confirm or replace these with their canonical
#   NamingSystem URLs if they publish them.
#
# MAPPING DSL REFERENCE:
#
#   column:      source column name from the CSV header row
#   resource:    target FHIR resource type (Patient, Immunization, Organization, Location)
#   path:        FHIRPath navigation to the target element (always a legitimate FHIRPath).
#                  Extended notation: address(N) selects the Nth Patient.address slot
#                  (1-based, created on demand). No use code is set on either slot;
#                  slot order conveys the relationship (1=current, 2=at time of
#                  vaccination). Slots with no populated fields after mapping are pruned.
#   type:        primitive type for direct assignment: string, date, dateTime, boolean,
#                  decimal, code. When value: is present, type: still governs
#                  concept_map translation but value: controls what is written.
#   value:       FHIRPath-compatible expression that constructs a complex value.
#                  $value   = concept-mapped column value (or raw if no concept_map)
#                  $row.COL = any column from the current CSV row
#                  Constructor syntax: TypeName{field: expr, ...}
#                    e.g. Coding{system: 'http://...', code: $value}
#                       ContactPoint{system: 'phone', value: $value}
#                  When path: targets a list (telecom, vaccineCode.coding, etc.),
#                  the constructed value is appended to that list.
#   concept_map: list of {from, to} pairs applied to the raw column value before
#                  it is assigned or passed to value: as $value.
#   system:      shorthand for Identifier targets only; sets Identifier.system when
#                  path: resolves to an identifier element and no value: is present.
#   is_last_updated: true marks this column as the _lastUpdated temporal filter target.
#
# REVIEW CHECKLIST (task 2.3b):
#   [x] DOUBLE column stripping -- implemented in SqlTableMapper.stripDoubleZero()
#   [ ] Confirm https://doh.wa.gov/NamingSystem/* URIs with WA DOH
#   [ ] Confirm HISTORICAL values (assumed "N"=administered, "Y"=historical in VACCINATION_MASTER)
#   [ ] Confirm INSERT_STAMP format in CSV exports (Databricks timestamp:
#         "2020-03-15T14:30:00.000" or "2020-03-15 14:30:00")
#   [ ] Confirm whether ANATOMICAL_SITE, ANATOMICAL_ROUTE, CC_VOLUME,
#         IWEB_VACC_EVENT_ID are present in WA DOH exports
#         (in the notebook SELECT but absent from the 2026-05-27 live dictionary)
#   [x] PAT_RACE1-6 concept maps -- taken from commented-out RecipientRace1-6
#         CASE expressions in the Databricks notebook (lines 563-628)
#   [ ] Confirm PAT_RACE1-6 domain: are the 9 integer codes (1-9) the exhaustive set,
#         or can other codes appear (e.g., additional CDC CDCREC detailed race codes)?
#         If additional codes are possible, the concept_maps are incomplete and unrecognized
#         codes will pass through as-is to the ombCategory slot, which would be wrong.
#   [ ] Confirm PAT_ETHNICITY_CODE domain: is it limited to the two OMB values
#         (H -> 2135-2 Hispanic or Latino, N -> 2186-5 Not Hispanic or Latino), or does
#         it include granular CDC CDCREC ethnicity codes (e.g., 2148-5 Mexican, 2155-0
#         Puerto Rican)?  If granular codes are possible, the mapping must be restructured:
#         granular codes go into a "detailed" sub-extension, and the ombCategory slot must
#         carry the parent OMB code (derived from the granular code) -- the current mapping
#         treats every code as an ombCategory entry and will be incorrect for granular codes.
#   [ ] Confirm PAT_GENDER values in PATIENT_MASTER (assumed M/F/U)

mappings:

  # -----------------------------------------------------------------------
  # PATIENT IDENTITY
  # NOTE: ASIIS_PAT_ID is CAST AS DOUBLE -- CSV value will be "12345678.0"
  # -----------------------------------------------------------------------

  - column: ASIIS_PAT_ID
    resource: Patient
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/ASIIS_PAT_ID"

  # -----------------------------------------------------------------------
  # PATIENT DEMOGRAPHICS  (used for patient search matching)
  # -----------------------------------------------------------------------

  - column: PAT_LAST_NAME
    resource: Patient
    path: name.family
    type: string

  - column: PAT_FIRST_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_MIDDLE_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_BIRTH_DATE
    resource: Patient
    path: birthDate
    type: date

  - column: PAT_GENDER
    resource: Patient
    path: gender
    type: code
    concept_map:
      - from: M
        to: male
      - from: F
        to: female
      - from: U
        to: unknown

  # -----------------------------------------------------------------------
  # PATIENT LANGUAGE
  # -----------------------------------------------------------------------

  - column: PAT_LANGUAGE
    resource: Patient
    path: communication.language
    type: string

  # -----------------------------------------------------------------------
  # PATIENT CONTACT
  # ContactPoint constructed via value: expression; system discriminates
  # phone from email entries in the telecom list.
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_PHONE
    resource: Patient
    path: telecom
    value: "ContactPoint{system: 'phone', value: $value}"

  - column: PAT_ADDRESS_EMAIL
    resource: Patient
    path: telecom
    value: "ContactPoint{system: 'email', value: $value}"

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (current) -- address slot 1
  # All PAT_ADDRESS_* fields populate the same Address entry (address(1)).
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_STREET1
    resource: Patient
    path: address(1).line
    type: string

  - column: PAT_ADDRESS_STREET2
    resource: Patient
    path: address(1).line
    type: string

  - column: PAT_ADDRESS_CITY
    resource: Patient
    path: address(1).city
    type: string

  - column: PAT_ADDRESS_STATE
    resource: Patient
    path: address(1).state
    type: string

  - column: PAT_ADDRESS_ZIP
    resource: Patient
    path: address(1).postalCode
    type: string

  - column: PAT_COUNTY_CODE
    resource: Patient
    path: address(1).district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (at time of vaccination) -- address slot 2
  # Databricks builds this via the ADDRESS_ATO_VAX subquery (closest address
  # record to the vaccination date). No use code is assigned; slot order
  # (address(2) after address(1)) conveys the at-time-of-vaccination
  # relationship to DOH consumers. Because the source CSV is denormalized
  # (one row per vaccination event), a patient may produce multiple address(2)
  # entries across rows; consecutive duplicate addresses are collapsed by the
  # mapper after all rows for a patient are processed.
  #
  # NOTE: The ADDRESS_ATO_VAX subquery in the Databricks notebook contains a
  # JOIN mismatch: contraindication and deferral UNION branches build their
  # EVENT_ADDRESS_ASSOCIATOR using INSERT_STAMP or DEFERRAL_DATE, but the main
  # query joins on CONCAT(ASIIS_VACC_CODE, VACC_DATE). Only the vaccination
  # branch ever matches. Ask WA DOH whether this is intentional.
  # -----------------------------------------------------------------------

  - column: ATO_PAT_ADDRESS_STREET1
    resource: Patient
    path: address(2).line
    type: string

  - column: ATO_PAT_ADDRESS_STREET2
    resource: Patient
    path: address(2).line
    type: string

  - column: ATO_PAT_ADDRESS_CITY
    resource: Patient
    path: address(2).city
    type: string

  - column: ATO_PAT_ADDRESS_STATE
    resource: Patient
    path: address(2).state
    type: string

  - column: ATO_PAT_ADDRESS_ZIP
    resource: Patient
    path: address(2).postalCode
    type: string

  - column: ATO_PAT_COUNTY_CODE
    resource: Patient
    path: address(2).district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ETHNICITY
  # US Core ethnicity extension. value: expression appends an ombCategory
  # sub-extension with a valueCoding from the CDCREC code system.
  # Concept map pending WA DOH confirmation of whether values are OMB codes
  # (e.g., "2135-2") or internal WAIIS integers.
  # -----------------------------------------------------------------------

  - column: PAT_ETHNICITY_CODE
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    # TODO: add concept_map once WA DOH confirms ethnicity code values

  # -----------------------------------------------------------------------
  # PATIENT RACE  (PAT_RACE1-6)
  # Databricks pivots PATIENT_RACE_RESERVE.pat_race (try_cast to int) into six
  # slots ordered by race code integer ascending. The OMB mappings below are
  # taken directly from the commented-out RecipientRace1-6 CASE expressions in
  # the Databricks notebook (lines 563-628). Code 3 has no WHEN clause and is
  # left unmapped. Code 9 and ELSE (RecipientRace1) map to 'UNK' and are
  # silently skipped (no ombCategory sub-extension for unknown race).
  # Both slots 6 and 8 map to '2131-1' (Other Race).
  # All six columns accumulate ombCategory sub-extensions into the single
  # US Core race extension. CDCREC system: urn:oid:2.16.840.1.113883.6.238
  # -----------------------------------------------------------------------

  - column: PAT_RACE1
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE2
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE3
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE4
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE5
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE6
    resource: Patient
    path: "extension('http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension('ombCategory').valueCoding"
    value: "Coding{system: 'urn:oid:2.16.840.1.113883.6.238', code: $value}"
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  # -----------------------------------------------------------------------
  # IMMUNIZATION IDENTITY
  # -----------------------------------------------------------------------

  - column: VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/VACC_EVENT_ID"

  # IWEB_VACC_EVENT_ID: present in the Databricks notebook SELECT but absent
  # from the 2026-05-27 live dictionary -- may have been removed from the table.
  - column: IWEB_VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/IWEB_VACC_EVENT_ID"

  # -----------------------------------------------------------------------
  # VACCINE PRODUCT
  # vaccineCode is a CodeableConcept; each column contributes one Coding to
  # vaccineCode.coding. value: constructs the Coding with the correct system.
  # NOTE: BEST_CDC_CODE and Asiis_Vacc_Code are CAST AS DOUBLE in the view --
  #   CSV values will be float strings ("208.0"). stripDoubleZero() normalizes.
  # NOTE: Asiis_Vacc_Code uses mixed case in the live dictionary.
  # -----------------------------------------------------------------------

  - column: BEST_CDC_CODE
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'http://hl7.org/fhir/sid/cvx', code: $value}"

  # Column name is "Asiis_Vacc_Code" (mixed case) per 2026-05-27 dictionary.
  - column: Asiis_Vacc_Code
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'https://doh.wa.gov/NamingSystem/Asiis_Vacc_Code', code: $value}"

  # FAMILY_CODE: ImmuCast (STC) internal vaccine family grouping code.
  # Codes are integers (1-24, with gaps) mapped to ACIP vaccine families:
  #   1=DTaP/DT/Td/Tdap, 2=HIB, 3=POLIO, 4=HepB(3-dose), 5=MMR,
  #   6=VARICELLA, 7=MENINGOCOCCAL, 9=HepA, 10=FLU, 11=PneumoPCV,
  #   12=HepB, 13=ANTHRAX, 14=SMALLPOX, 15=MEASLES, 16=MUMPS,
  #   17=RUBELLA, 18=PneumoPPV, 20=ROTAVIRUS, 21=HPV, 22=ZOSTER,
  #   23=H1N1(inactive), 24=Tdap(inactive, included in code 1)
  # Source: STC ImmuCast documentation (vaccine-group-level grouping only --
  # NOT a CVX, CPT, or MVX code; those use official national publications).
  # System OID must be confirmed with WA DOH -- ImmuCast does not publish a
  # registered OID; WA DOH may assign a local WAIIS OID for this code system.
  - column: FAMILY_CODE
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'https://documentation.stchome.com/assets/prodfiles/ImmuCast/5_18_1/html/vacc_codes.htm', code: $value}"

  - column: NDC_CODE
    resource: Immunization
    path: vaccineCode.coding
    value: "Coding{system: 'http://hl7.org/fhir/sid/ndc', code: $value}"

  # manufacturer is a Reference(Organization); the MVX code is carried as a
  # logical identifier so no Organization resource needs to be created inline.
  - column: MANU_CODE
    resource: Immunization
    path: manufacturer
    value: "Reference{identifier: Identifier{system: 'http://terminology.hl7.org/CodeSystem/mvx', value: $value}}"

  - column: LOT_NUM
    resource: Immunization
    path: lotNumber
    type: string

  - column: EXPIRATION_DATE
    resource: Immunization
    path: expirationDate
    type: date

  # -----------------------------------------------------------------------
  # ADMINISTRATION
  # ANATOMICAL_SITE and ANATOMICAL_ROUTE are present in the notebook SELECT
  # but absent from the 2026-05-27 live dictionary. Included here in case
  # WA DOH exports include them; ignored if the column is not present.
  # View transforms: ANATOMICAL_SITE -> HL7 v2 body site codes (LT, LA, etc.)
  #                  ANATOMICAL_ROUTE -> NCI C-codes (C28161 etc.)
  # Both site and route are CodeableConcept; value: constructs a single Coding.
  # -----------------------------------------------------------------------

  - column: VACC_DATE
    resource: Immunization
    path: occurrenceDateTime
    type: date

  - column: ANATOMICAL_SITE
    resource: Immunization
    path: site
    value: "CodeableConcept{coding: Coding{system: 'http://terminology.hl7.org/CodeSystem/v2-0163', code: $value}}"

  - column: ANATOMICAL_ROUTE
    resource: Immunization
    path: route
    value: "CodeableConcept{coding: Coding{system: 'http://ncimeta.nci.nih.gov', code: $value}}"

  # CC_VOLUME: present in the notebook SELECT but absent from the 2026-05-27 dictionary.
  # doseQuantity is a SimpleQuantity; unit assumed mL (CC = cubic centimeter = mL).
  # Confirm unit with WA DOH if this column appears in exports.
  - column: CC_VOLUME
    resource: Immunization
    path: doseQuantity
    value: "Quantity{value: $value, unit: 'mL', system: 'http://unitsofmeasure.org', code: 'mL'}"

  # DOSE_NUMBER: view CASE outputs actual dose number string, 'INV' (invalid),
  # or 'UNK' (unknown). Mapped to doseNumberString (the string variant of the
  # choice type protocolApplied.doseNumber[x]).
  - column: DOSE_NUMBER
    resource: Immunization
    path: protocolApplied.doseNumberString
    type: string

  # SERIES_COMPLETE: view CASE outputs 'YES', 'NO', or 'UNK'.
  # No FHIR R4 Immunization element accepts a yes/no completion flag directly.
  # Dropped; revisit if WA DOH requires this data point.

  # -----------------------------------------------------------------------
  # RECORD ORIGIN
  # -----------------------------------------------------------------------

  # HISTORICAL: passed through as-is from VACCINATION_MASTER (no view transform).
  # Assumed values: N = administered at facility (primarySource=true),
  #                 Y = historical record (primarySource=false). Verify with WA DOH.
  - column: HISTORICAL
    resource: Immunization
    path: primarySource
    type: boolean
    concept_map:
      - from: "N"
        to: "true"
      - from: "Y"
        to: "false"

  # reportOrigin is a CodeableConcept. REPORTING_METHOD values are passed through
  # from WAIIS unchanged; no code system is documented. Represented as text until
  # WA DOH confirms whether a coded system applies.
  - column: REPORTING_METHOD
    resource: Immunization
    path: reportOrigin
    value: "CodeableConcept{text: $value}"

  # VFC_ELIGIBLE: CAST AS DOUBLE in the view -- CSV value is "1.0" or "0.0".
  # stripDoubleZero normalizes to "1" or "0" before concept_map lookup.
  # fundingSource is a CodeableConcept using HL7 immunization-funding-source codes.
  - column: VFC_ELIGIBLE
    resource: Immunization
    path: fundingSource
    value: "CodeableConcept{coding: Coding{system: 'http://terminology.hl7.org/CodeSystem/immunization-funding-source', code: $value}}"
    concept_map:
      - from: "1"
        to: "public"
      - from: "0"
        to: "private"

  # -----------------------------------------------------------------------
  # AUDIT / TEMPORAL
  # INSERT_STAMP is the primary _lastUpdated field for temporal filtering.
  # Databricks timestamp format in CSV: "2020-03-15T14:30:00.000" or
  # "2020-03-15 14:30:00" -- confirm with WA DOH export settings.
  # -----------------------------------------------------------------------

  - column: INSERT_STAMP
    resource: Immunization
    path: recorded
    type: dateTime
    is_last_updated: true

  # REGISTRY_ENTRY_STAMP: removed -- INSERT_STAMP is the canonical recorded date.
  # DELETION_DATE: removed -- WHERE clause guarantees it is always NULL.

  # -----------------------------------------------------------------------
  # ADMINISTERING ORGANIZATION / FACILITY
  # Note: Location and Organization resources require additional mapper
  # support. Included for documentation completeness; deferred to future work.
  # PROVIDER_FACILITY_TYPE: view CASE outputs HL7 v2 table 0442 numeric codes
  # (e.g., '9'=Hospital, '12'=Private Practice, '19'=Public Health Dept).
  # type is a CodeableConcept; value: constructs a single Coding.
  # -----------------------------------------------------------------------

  - column: ORG_NAME
    resource: Organization
    path: name
    type: string

  - column: VFC_PIN
    resource: Organization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/VFC_PIN"

  - column: IRMS_SYS_ID
    resource: Organization
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/IRMS_SYS_ID"

  - column: ASIIS_FAC_ID
    resource: Location
    path: identifier
    type: string
    system: "https://doh.wa.gov/NamingSystem/ASIIS_FAC_ID"

  - column: FAC_NAME
    resource: Location
    path: name
    type: string

  - column: PROVIDER_FACILITY_TYPE
    resource: Location
    path: type
    value: "CodeableConcept{coding: Coding{system: 'http://terminology.hl7.org/CodeSystem/v2-0442', code: $value}}"

  - column: FAC_ADDRESS_STREET1
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_STREET2
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_CITY
    resource: Location
    path: address.city
    type: string

  - column: FAC_ADDRESS_STATE
    resource: Location
    path: address.state
    type: string

  - column: FAC_ADDRESS_ZIP
    resource: Location
    path: address.postalCode
    type: string

  - column: FAC_ADDRESS_COUNTY_CODE
    resource: Location
    path: address.district
    type: string
