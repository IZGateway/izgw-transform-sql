# WA DOH all_vax_event column mapping
# Source: Washington Automated Immunization Information System (WAIIS) denormalized view
#
# Reference files (docs/sql-fhir/):
#   wa-doh-all-vax-event-dictionary.csv   -- live schema as of 2026-05-27 (56 columns)
#   wa-doh-all-vax-event-notebook.txt     -- Databricks notebook that builds the view
#   wa-doh-all-vax-event-mapping.csv      -- enriched FHIR element assignments
#
# KNOWN DATA QUALITY ISSUES (must be resolved before production use):
#   - ASIIS_PAT_ID and BEST_CDC_CODE are CAST AS DOUBLE in the view.
#     CSV exports will produce float strings (e.g., "12345678.0", "208.0").
#     The mapper must strip the ".0" suffix for these columns or they will not
#     match FHIR identifier/code lookups.  See task 2.3b.
#   - Asiis_Vacc_Code column name uses mixed case in the live dictionary.
#
# REVIEW CHECKLIST (task 2.3b):
#   [ ] Replace all TODO:waiis-* OID placeholders with correct OIDs from WA DOH
#   [ ] Confirm mapper handles DOUBLE columns (ASIIS_PAT_ID, BEST_CDC_CODE, etc.)
#         -- they arrive as "208.0", "12345678.0" in CSV exports
#   [ ] Confirm HISTORICAL values are exactly "N" / "Y" in VACCINATION_MASTER
#   [ ] Confirm INSERT_STAMP format in CSV exports (Databricks timestamp:
#         "2020-03-15T14:30:00.000" or "2020-03-15 14:30:00")
#   [ ] Confirm whether ANATOMICAL_SITE, ANATOMICAL_ROUTE, CC_VOLUME,
#         DELETION_DATE, IWEB_VACC_EVENT_ID are present in WA DOH exports
#         (these are in the notebook SELECT but absent from the 2026-05-27
#         live dictionary -- they may have been removed from the table)
#   [ ] Verify PAT_RACE1-6 concept map below against current WAIIS race codes
#         (source: commented-out mapping in All_Vax_Event_notebook_2026_05_27.txt)

mappings:

  # -----------------------------------------------------------------------
  # PATIENT IDENTITY
  # NOTE: ASIIS_PAT_ID is CAST AS DOUBLE -- CSV value will be "12345678.0"
  # -----------------------------------------------------------------------

  - column: ASIIS_PAT_ID
    resource: Patient
    path: identifier
    type: string
    system: "TODO:waiis-patient-id-oid"   # replace with the correct WAIIS OID from WA DOH

  # -----------------------------------------------------------------------
  # PATIENT DEMOGRAPHICS  (used for patient search matching)
  # -----------------------------------------------------------------------

  - column: PAT_LAST_NAME
    resource: Patient
    path: name.family
    type: string

  - column: PAT_FIRST_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_MIDDLE_NAME
    resource: Patient
    path: name.given
    type: string

  - column: PAT_BIRTH_DATE
    resource: Patient
    path: birthDate
    type: date

  - column: PAT_GENDER
    resource: Patient
    path: gender
    type: code
    concept_map:
      - from: M
        to: male
      - from: F
        to: female
      - from: U
        to: unknown

  # -----------------------------------------------------------------------
  # PATIENT LANGUAGE
  # -----------------------------------------------------------------------

  - column: PAT_LANGUAGE
    resource: Patient
    path: communication.language
    type: string

  # -----------------------------------------------------------------------
  # PATIENT CONTACT
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_PHONE
    resource: Patient
    path: telecom.phone
    type: string

  - column: PAT_ADDRESS_EMAIL
    resource: Patient
    path: telecom.email
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (current)
  # -----------------------------------------------------------------------

  - column: PAT_ADDRESS_STREET1
    resource: Patient
    path: address.line
    type: string

  - column: PAT_ADDRESS_STREET2
    resource: Patient
    path: address.line
    type: string

  - column: PAT_ADDRESS_CITY
    resource: Patient
    path: address.city
    type: string

  - column: PAT_ADDRESS_STATE
    resource: Patient
    path: address.state
    type: string

  - column: PAT_ADDRESS_ZIP
    resource: Patient
    path: address.postalCode
    type: string

  - column: PAT_COUNTY_CODE
    resource: Patient
    path: address.district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ADDRESS (at time of vaccination)
  # Note: same FHIR paths as current address -- mapper does not yet
  # distinguish use='old' vs use='home'. Deferred to future enhancement.
  # -----------------------------------------------------------------------

  - column: ATO_PAT_ADDRESS_STREET1
    resource: Patient
    path: address.line
    type: string

  - column: ATO_PAT_ADDRESS_STREET2
    resource: Patient
    path: address.line
    type: string

  - column: ATO_PAT_ADDRESS_CITY
    resource: Patient
    path: address.city
    type: string

  - column: ATO_PAT_ADDRESS_STATE
    resource: Patient
    path: address.state
    type: string

  - column: ATO_PAT_ADDRESS_ZIP
    resource: Patient
    path: address.postalCode
    type: string

  - column: ATO_PAT_COUNTY_CODE
    resource: Patient
    path: address.district
    type: string

  # -----------------------------------------------------------------------
  # PATIENT ETHNICITY
  # Note: maps to US Core ethnicity extension -- requires extension support
  # in the mapper (not yet implemented). Included for documentation.
  # -----------------------------------------------------------------------

  - column: PAT_ETHNICITY_CODE
    resource: Patient
    path: extension.ethnicity
    type: code

  # -----------------------------------------------------------------------
  # PATIENT RACE  (slots 1-6, ASIIS integer codes)
  # Concept map derived from commented-out mapping in the Databricks notebook.
  # Verify these code values against current WAIIS race table before production.
  # Note: mapper extension support for multi-slot race arrays is not yet
  # implemented; these entries are documentation until that work lands.
  # -----------------------------------------------------------------------

  - column: PAT_RACE1
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"   # White
      - from: "2"
        to: "2054-5"   # Black or African American
      - from: "4"
        to: "2028-9"   # Asian
      - from: "5"
        to: "1002-5"   # American Indian or Alaska Native
      - from: "6"
        to: "2131-1"   # Other Race
      - from: "7"
        to: "2076-8"   # Native Hawaiian or Other Pacific Islander
      - from: "8"
        to: "2131-1"   # Other Race
      - from: "9"
        to: "UNK"

  - column: PAT_RACE2
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE3
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE4
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE5
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  - column: PAT_RACE6
    resource: Patient
    path: extension.race
    type: code
    concept_map:
      - from: "1"
        to: "2106-3"
      - from: "2"
        to: "2054-5"
      - from: "4"
        to: "2028-9"
      - from: "5"
        to: "1002-5"
      - from: "6"
        to: "2131-1"
      - from: "7"
        to: "2076-8"
      - from: "8"
        to: "2131-1"
      - from: "9"
        to: "UNK"

  # -----------------------------------------------------------------------
  # IMMUNIZATION IDENTITY
  # -----------------------------------------------------------------------

  - column: VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "TODO:waiis-vacc-event-oid"   # replace with correct OID; synthetic: REPLACE(CONCAT('WA','V',...))

  # IWEB_VACC_EVENT_ID: present in the Databricks notebook SELECT but absent
  # from the 2026-05-27 live dictionary -- may have been removed from the table.
  - column: IWEB_VACC_EVENT_ID
    resource: Immunization
    path: identifier
    type: string
    system: "TODO:waiis-iweb-vacc-event-oid"   # replace with correct OID for iWeb legacy event ID

  # -----------------------------------------------------------------------
  # VACCINE PRODUCT
  # NOTE: BEST_CDC_CODE is CAST AS DOUBLE -- CSV value will be "208.0" not "208".
  # NOTE: Asiis_Vacc_Code uses mixed case in the live dictionary.
  # -----------------------------------------------------------------------

  - column: BEST_CDC_CODE
    resource: Immunization
    path: vaccineCode.cvx
    type: code
    system: "http://hl7.org/fhir/sid/cvx"

  # Column name is "Asiis_Vacc_Code" (mixed case) per 2026-05-27 dictionary.
  # CAST AS DOUBLE -- will be a float string in CSV exports.
  - column: Asiis_Vacc_Code
    resource: Immunization
    path: vaccineCode
    type: code
    system: "TODO:waiis-asiis-vacc-code-oid"   # replace with correct OID for internal ASIIS vaccine code

  - column: FAMILY_CODE
    resource: Immunization
    path: vaccineCode
    type: code
    system: "TODO:waiis-family-code-oid"   # replace with correct OID for WAIIS vaccine family code

  - column: NDC_CODE
    resource: Immunization
    path: vaccineCode.ndc
    type: code
    system: "http://hl7.org/fhir/sid/ndc"

  - column: MANU_CODE
    resource: Immunization
    path: manufacturer
    type: code
    system: "http://terminology.hl7.org/CodeSystem/mvx"

  - column: LOT_NUM
    resource: Immunization
    path: lotNumber
    type: string

  - column: EXPIRATION_DATE
    resource: Immunization
    path: expirationDate
    type: date

  # -----------------------------------------------------------------------
  # ADMINISTRATION
  # ANATOMICAL_SITE and ANATOMICAL_ROUTE are present in the notebook SELECT
  # but absent from the 2026-05-27 live dictionary. Included here in case
  # WA DOH exports include them; ignored if the column is not present.
  # View transforms: ANATOMICAL_SITE -> HL7 v2 body site codes (LT, LA, etc.)
  #                  ANATOMICAL_ROUTE -> NCI C-codes (C28161 etc.)
  # -----------------------------------------------------------------------

  - column: VACC_DATE
    resource: Immunization
    path: occurrenceDateTime
    type: date

  - column: ANATOMICAL_SITE
    resource: Immunization
    path: site
    type: code
    system: "http://terminology.hl7.org/CodeSystem/v2-0163"

  - column: ANATOMICAL_ROUTE
    resource: Immunization
    path: route
    type: code
    system: "http://ncimeta.nci.nih.gov"

  # CC_VOLUME: present in the notebook SELECT but absent from the 2026-05-27 dictionary.
  - column: CC_VOLUME
    resource: Immunization
    path: doseQuantity
    type: decimal

  # DOSE_NUMBER: view CASE outputs actual dose number string, 'INV' (invalid),
  # or 'UNK' (unknown).  Passed through as-is.
  - column: DOSE_NUMBER
    resource: Immunization
    path: protocolApplied.doseNumber
    type: string

  # SERIES_COMPLETE: view CASE outputs 'YES', 'NO', or 'UNK'.
  - column: SERIES_COMPLETE
    resource: Immunization
    path: protocolApplied.seriesDosesString
    type: string

  # -----------------------------------------------------------------------
  # RECORD ORIGIN
  # -----------------------------------------------------------------------

  # HISTORICAL: passed through as-is from VACCINATION_MASTER (no view transform).
  # Assumed values: N = administered at facility (primarySource=true),
  #                 Y = historical record (primarySource=false). Verify with WA DOH.
  - column: HISTORICAL
    resource: Immunization
    path: primarySource
    type: boolean
    concept_map:
      - from: "N"
        to: "true"
      - from: "Y"
        to: "false"

  - column: REPORTING_METHOD
    resource: Immunization
    path: reportOrigin
    type: string

  # VFC_ELIGIBLE: CAST AS DOUBLE -- confirm CSV export format.
  # FHIR fundingSource is a CodeableConcept (VFC eligibility codes).
  - column: VFC_ELIGIBLE
    resource: Immunization
    path: fundingSource
    type: string

  # -----------------------------------------------------------------------
  # AUDIT / TEMPORAL
  # INSERT_STAMP is the primary _lastUpdated field for temporal filtering.
  # Databricks timestamp format in CSV: "2020-03-15T14:30:00.000" or
  # "2020-03-15 14:30:00" -- confirm with WA DOH export settings.
  # -----------------------------------------------------------------------

  - column: INSERT_STAMP
    resource: Immunization
    path: recorded
    type: dateTime
    is_last_updated: true

  - column: REGISTRY_ENTRY_STAMP
    resource: Immunization
    path: recorded
    type: date

  # DELETION_DATE: present in the notebook SELECT but absent from the 2026-05-27
  # dictionary. The view WHERE clause filters vm.deletion_date IS NULL, so all
  # exported records are active and this column would always be NULL anyway.
  - column: DELETION_DATE
    resource: Immunization
    path: status
    type: date

  # -----------------------------------------------------------------------
  # ADMINISTERING ORGANIZATION / FACILITY
  # Note: Location and Organization resources require additional mapper
  # support. Included for documentation completeness; deferred to future work.
  # PROVIDER_FACILITY_TYPE: view CASE outputs HL7 v2 table 0442 numeric codes
  # (e.g., '9'=Hospital, '12'=Private Practice, '19'=Public Health Dept).
  # -----------------------------------------------------------------------

  - column: ORG_NAME
    resource: Organization
    path: name
    type: string

  - column: VFC_PIN
    resource: Organization
    path: identifier
    type: string
    system: "TODO:waiis-vfc-pin-oid"   # replace with correct OID for VFC program PIN

  - column: IRMS_SYS_ID
    resource: Organization
    path: identifier
    type: string
    system: "TODO:waiis-irms-sys-id-oid"   # replace with correct OID for IRMS system ID

  - column: ASIIS_FAC_ID
    resource: Location
    path: identifier
    type: string
    system: "TODO:waiis-asiis-fac-id-oid"   # replace with correct OID for ASIIS facility ID

  - column: FAC_NAME
    resource: Location
    path: name
    type: string

  - column: PROVIDER_FACILITY_TYPE
    resource: Location
    path: type
    type: code
    system: "http://terminology.hl7.org/CodeSystem/v2-0442"

  - column: FAC_ADDRESS_STREET1
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_STREET2
    resource: Location
    path: address.line
    type: string

  - column: FAC_ADDRESS_CITY
    resource: Location
    path: address.city
    type: string

  - column: FAC_ADDRESS_STATE
    resource: Location
    path: address.state
    type: string

  - column: FAC_ADDRESS_ZIP
    resource: Location
    path: address.postalCode
    type: string

  - column: FAC_ADDRESS_COUNTY_CODE
    resource: Location
    path: address.district
    type: string
